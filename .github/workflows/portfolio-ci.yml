name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start deterministic local site
        run: python -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
      - name: Health check
        run: |
          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Browser and public-safety quality gate
        env:
          PORTFOLIO_BASE_URL: http://127.0.0.1:8080
        run: python -m pytest
